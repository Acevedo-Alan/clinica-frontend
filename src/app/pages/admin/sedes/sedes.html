<div class="pagina">
  <div class="encabezado">
    <h1>Sedes</h1>
    <button mat-flat-button color="primary" (click)="nueva()">
      <mat-icon>add</mat-icon>
      Nueva sede
    </button>
  </div>

  <mat-form-field class="filtro">
    <mat-label>Buscar</mat-label>
    <input
      matInput
      [ngModel]="filtro()"
      (ngModelChange)="filtro.set($event)"
      placeholder="Nombre, dirección o teléfono"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  @if (cargando()) {
    <div class="centro"><mat-spinner diameter="40" /></div>
  } @else if (error(); as e) {
    <div class="aviso-error" role="alert">
      <mat-icon>error</mat-icon>
      <span>{{ e }}</span>
      <button mat-button (click)="cargar()">Reintentar</button>
    </div>
  } @else if (filtradas().length === 0) {
    <p class="vacio">No hay sedes para mostrar.</p>
  } @else {
    <table mat-table [dataSource]="filtradas()" class="tabla">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let s">{{ s.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let s">{{ s.direccion }}</td>
      </ng-container>
      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let s">{{ s.telefono }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let s" class="acciones">
          <button mat-icon-button matTooltip="Editar" (click)="editar(s)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" (click)="eliminar(s)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  }
</div>
