<h2 mat-dialog-title>{{ data ? 'Modificar cobertura' : 'Nueva cobertura' }}</h2>
<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="contenido">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="30" />
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>
    @if (error(); as e) {
      <p class="error">{{ e }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="null">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      @if (guardando()) {
        <mat-spinner diameter="20" />
      } @else {
        Guardar
      }
    </button>
  </mat-dialog-actions>
</form>
