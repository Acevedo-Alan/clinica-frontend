<h2 mat-dialog-title>Marcar turno como atendido</h2>
<form [formGroup]="form" (ngSubmit)="confirmar()">
  <mat-dialog-content class="contenido">
    <p class="paciente">{{ turno.paciente_apellido }}, {{ turno.paciente_nombre }} — {{ turno.hora }}</p>

    <mat-form-field>
      <mat-label>Diagnóstico</mat-label>
      <textarea matInput formControlName="diagnostico" rows="2" maxlength="255"></textarea>
      @if (form.controls.diagnostico.hasError('required')) {
        <mat-error>El diagnóstico es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tratamiento</mat-label>
      <textarea matInput formControlName="tratamiento" rows="2" maxlength="255"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Observaciones</mat-label>
      <textarea matInput formControlName="observaciones" rows="2" maxlength="255"></textarea>
    </mat-form-field>

    @if (error(); as e) {
      <p class="error">{{ e }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      @if (guardando()) {
        <mat-spinner diameter="20" />
      } @else {
        Confirmar atención
      }
    </button>
  </mat-dialog-actions>
</form>
